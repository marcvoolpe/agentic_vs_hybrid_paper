<p>
  {% if player.is_supplier %}
    <strong>The Production Cost (PC) is {% group.production_cost %}€.</strong>
    <strong>The Retail Price (RP) is {% group.market_price %}€. </strong>
  {% else %}
    <strong>The Retail Price (RP) is {% group.market_price %}€.</strong>
    <strong>The Production Cost (PC) is {% group.production_cost %}€.</strong>
  {% endif %}
</p>
